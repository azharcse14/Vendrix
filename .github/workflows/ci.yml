# CI (13.6): protiti push (main) ar PR e. Local er `make check` er moto.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.4

jobs:
  go:
    name: Go (gofmt, vet, test, docsync, race, govulncheck, staticcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: quick-check (gofmt, vet, test, docsync, rule check)
        run: QUICK_ALL=1 QUICK_PARTS=go bash scripts/quick-check.sh
      - name: race
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: staticcheck
        working-directory: backend
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  dart:
    name: "Dart (packages/shared, website: format, analyze, test, build)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.7"
      - name: quick-check (Dart)
        run: QUICK_ALL=1 QUICK_PARTS=dart bash scripts/quick-check.sh
      # 10.5: client compile er bhul analyze e dhora pore na; JS er size protibar log e (hothat barle karon khojo)
      - name: website build (Jaspr, Tailwind)
        working-directory: website
        run: |
          dart pub global activate jaspr_cli 0.23.5
          bash ../scripts/tailwind.sh --minify
          dart pub global run jaspr_cli:jaspr build
          ls -l build/jaspr/web/*.js
          echo "main.client.dart.js gzip: $(gzip -c build/jaspr/web/main.client.dart.js | wc -c) byte"

  database:
    name: Database (001_init + constraint test, Go DB test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: db-test
        run: bash scripts/db-test.sh
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: backend/go.sum
      # asol Postgres e Go test (jobs, shop, migrate); db-test er por, karon shop_app role oikhane banay
      - name: go test (database)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...

  # Admin (Flutter web, 11.7 item 10): Flutter 3.47.9 pin (2.3); build e CanvasKit nijer server theke (CDN na).
  flutter:
    name: "Flutter (admin: format, analyze, test, build)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
      - name: quick-check (Flutter)
        run: QUICK_ALL=1 QUICK_PARTS=flutter bash scripts/quick-check.sh
      - name: admin build (JS, --no-web-resources-cdn)
        working-directory: admin
        run: |
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none
          echo "main.dart.js gzip: $(gzip -c build/web/main.dart.js | wc -c) byte"
