# CI (13.6): protiti push (main) ar PR e. Local er `make check` er moto.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.3

jobs:
  go:
    name: Go (gofmt, vet, test, docsync, race, govulncheck, staticcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: backend/go.sum
      - name: quick-check (gofmt, vet, test, docsync, rule check)
        run: QUICK_ALL=1 QUICK_PARTS=go bash scripts/quick-check.sh
      - name: race
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: staticcheck
        working-directory: backend
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  database:
    name: Database (001_init + constraint test)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: db-test
        run: bash scripts/db-test.sh

  # M2, M3, M7: packages/shared, website ba admin e pubspec.yaml ashle ekhane Dart job jog koro (4.6):
  # Dart/Flutter setup (version pin kora), tarpor `QUICK_ALL=1 QUICK_PARTS=dart bash scripts/quick-check.sh`.
  # CI te dart/flutter na thakle quick-check fail kore, tai job chhara Dart er check bad pore na.
